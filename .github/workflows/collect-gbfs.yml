name: Collect GBFS data

on:
  schedule:
    # Run away from the top of the hour, when scheduled workflows are busiest.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-gbfs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion dependency
        run: python -m pip install requests==2.32.3

      - name: Capture GBFS snapshot
        run: python src/ingest_data.py

      - name: Save snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbfs-snapshot-${{ github.run_id }}
          path: |
            data/raw/*.json
            reports/evidence/gbfs_capture_*.json
          if-no-files-found: error
          retention-days: 30
