name: MLOps Automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  trigger-check:
    name: Pengujian dan training kandidat
    # Only trusted owner changes may execute on the laptop and reach local services.
    if: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner && github.actor == github.repository_owner) }}
    runs-on: [self-hosted, linux, x64, gbfs-local]
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DVC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_SECRET_ACCESS_KEY }}
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      GBFS_BASE_PYTHON: ${{ vars.GBFS_BASE_PYTHON }}
    steps:
      - name: Bersihkan bukti dari eksekusi sebelumnya
        run: python3 -c "import os, shutil; shutil.rmtree(os.path.join(os.environ['RUNNER_TEMP'], 'gbfs-mlops'), ignore_errors=True)"

      - name: Ambil kode dari commit pemicu
        uses: actions/checkout@v4

      - name: Catat informasi pemicu
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Commit event: $GITHUB_SHA"
          git rev-parse HEAD

      - name: Siapkan Python
        run: |
          test -x "$GBFS_BASE_PYTHON" || { echo "Set repository variable GBFS_BASE_PYTHON to Python 3.11 on the runner"; exit 1; }
          "$GBFS_BASE_PYTHON" -c 'import sys; assert sys.version_info[:2] == (3, 11), "Python 3.11 diperlukan"'
          "$GBFS_BASE_PYTHON" -m venv "$RUNNER_TEMP/gbfs-venv"
          echo "$RUNNER_TEMP/gbfs-venv/bin" >> "$GITHUB_PATH"

      - name: Pasang dependensi
        run: uv pip install --python "$RUNNER_TEMP/gbfs-venv/bin/python" -r requirements.txt

      - name: Jalankan pengujian unit
        run: python -m pytest -q

      - name: Ambil dataset yang dilacak DVC
        run: python -m dvc pull data/processed.dvc

      - name: Validasi dataset aktual
        run: python -m src.modeling.validate_dataset

      - name: Latih kandidat tanpa registrasi
        run: |
          python -m src.modeling.train \
            --candidate-output "$RUNNER_TEMP/gbfs-mlops/candidate.json" \
            --report-output "$RUNNER_TEMP/gbfs-mlops/training-results.md"

      - name: Evaluasi metrik terhadap ambang
        run: |
          python -m src.modeling.validate_candidate \
            --candidate "$RUNNER_TEMP/gbfs-mlops/candidate.json" \
            --decision "$RUNNER_TEMP/gbfs-mlops/validation.json"

      - name: Daftarkan kandidat yang lolos ke Staging
        run: |
          python -m src.modeling.validate_candidate \
            --candidate "$RUNNER_TEMP/gbfs-mlops/candidate.json" \
            --decision "$RUNNER_TEMP/gbfs-mlops/validation.json" \
            --register

      - name: Simpan bukti kandidat dan evaluasi
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mlops-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gbfs-mlops/
          if-no-files-found: ignore
